<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | Cohort Friend Finder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>

  <a href="#main" class="skip-link">Skip to main content</a>

  <header>
    <nav class="navbar" aria-label="Main">
      <a href="/" class="logo">
        <img src="{{ url_for('static', filename='images/example-card.svg') }}" alt="Cohort Friend Finder, go to home page">
      </a>

      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/search">Student Search</a></li>
        <li><a href="/about-us">About Us</a></li>
        <li><a href="/#mission">Mission</a></li>
      </ul>

      <form class="search-bar" role="search" action="/search" method="get">
        <label for="student-search" class="visually-hidden">Search students</label>
        <input type="search" id="student-search" name="q" placeholder="Search students">
        <button type="submit">Search</button>
      </form>

      <a href="/login" class="button">Login</a>
    </nav>
  </header>

  <!-- profile.js fills this page in from the profiles service -->
  <main id="main" class="profile"
        data-api-url="{{ profiles_service_url }}"
        data-user-id="{{ user_id }}">

    <header class="profilehead">
      <div class="banner"></div>
      <div id="avatar"></div>
      <h1 class="name" id="profile-name"></h1>
      <p class="profilemeta" id="profile-meta" hidden></p>
    </header>

    <p id="status" class="status" role="status" aria-live="polite">Loading profile…</p>

    <section class="section" id="bio-section" aria-labelledby="bio-title" hidden>
      <h2 id="bio-title">Bio</h2>
      <p class="bio" id="profile-bio"></p>
    </section>

    <section class="section" id="org-section" aria-labelledby="org-title" hidden>
      <h2 id="org-title">Organization bio</h2>
      <p class="bio" id="org-bio"></p>
    </section>

    <p class="note" id="org-note" hidden></p>

    <p class="back"><a href="/search">&larr; Back to student search</a></p>
  </main>

  <footer>
    <p>Cohort Friend Finder</p>
  </footer>

  <script src="{{ url_for('static', filename='js/profile.js') }}"></script>
</body>
</html>
