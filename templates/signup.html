<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up Page</title>
  <link rel="stylesheet" href="../static/css/main.css">
  <link rel="stylesheet" href="../static/css/signup.css">
</head>
<body>
  <script src="../static/js/signup.js"></script>

  <a href="#main" class="skip-link">Skip to main content</a>

  <header>
    <nav class="navbar" aria-label="Main">
      <ul class="nav-links">
        <li><a href="/" aria-current="page">Home</a></li>
      </ul>

    </nav>
  </header>

  <main>
    <section class="auth-container">
        <!-- Left Side: Branding & Info -->
        <section class="auth-left">
            <div class="logo"><img src="../static/images/images4.jpg" alt="People wearing blue and looking at camera"></div>
            <h1>Finding Your Friends</h1>
            <p class="mission">We understand how hard it is to remember everyones name and how sometimes it can cause awkward situations, but those times are gone.</p>
        </section>

        <!-- Right Side: Actual Login/signup Form -->
        <section class="auth-right">
            <h2>Create an Account</h2>
            <form class="auth-form">
              <div class="form-group">
                <label for="name">Full Name</label>
                <input type="name" id="name" placeholder="John Doe" required>

              </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="button" class="submit-btn" onclick="signup()">Sign Up</button>
            </form>

            <p class="auth-switch">Have an account? <a href="login">Log In</a></p>
        </section>
    </section>
  </main>

  <footer>
    <p>Cohort Friend Finder</p>
  </footer>

</body>
</html>
