<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In Page</title>
  <link rel="stylesheet" href="../static/css/main.css">
  <link rel="stylesheet" href="../static/css/signup.css">
</head>
<body>
  <script src="{{ url_for('static', filename='js/session.js') }}" data-auth-url="{{ nav_auth_url }}"></script>

  <a href="#main" class="skip-link">Skip to main content</a>

  <header>
    <nav class="navbar" aria-label="Main">
      <ul class="nav-links">
        <li><a href="/" aria-current="page">Home</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <section class="auth-container">
        <!-- Left Side: Branding & Info -->
        <section class="auth-left">
          <figure class="image-container">
            <img src="../static/images/evanMarvell.jpg" alt="A group of students talking and looking at a computer">
            <figcaption>Photo by <a href="https://unsplash.com/@evan_marvell?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Evan Marvell</a> on <a href="https://unsplash.com/photos/group-of-young-people-engaging-with-technology-indoors-vG2SoCSpPEU?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a></figcaption>
          </figure class="image-container">
          <h1>Finding Your Friends</h1>
          <p class="mission">We understand how hard it is to remember everyones name and how sometimes it can cause awkward situations, but those times are gone.</p>
        </section>

        <!-- Right Side: Login Form -->
        <section class="auth-right">
            <h2>Welcome Back</h2>
            <form class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div id="error-message"></div>

                <button type="button" class="submit-btn">Log In</button>
            </form>

            <p class="auth-switch">Don't have an account? <a href="signup">Sign Up</a></p>
        </section>
    </section>
  </main>

  {% include '_footer.html' %}

  <script src="../static/js/login.js"></script>
</body>
</html>
