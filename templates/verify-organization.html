<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verifying your email | Cohort Friend Finder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/settings.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='images/logo.svg') }}" type="image/svg+xml">
</head>
<body>

  <a href="#main" class="skip-link">Skip to main content</a>

  {% set nav_active = '' %}
  {% include '_navbar.html' %}

  <main id="main" class="verify-page"
        data-api-url="{{ organizations_service_url }}"
        data-token="{{ token }}">
    <section class="verify-card" role="status" aria-live="polite">
      <h1 id="verify-title">Verifying your email…</h1>
      <p id="verify-message">One moment while we confirm your school email.</p>
      <p class="verify-actions" id="verify-actions" hidden>
        <a class="button" href="/settings">Go to settings</a>
        <a href="/">Back to home</a>
      </p>
    </section>
  </main>

  {% include '_footer.html' %}

  <script src="{{ url_for('static', filename='js/verify-organization.js') }}"></script>
</body>
</html>
